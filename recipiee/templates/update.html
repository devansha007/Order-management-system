<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    
   
    <form class="container col-6 card p-3 mt-5 shadow-lg" method="POST" enctype="multipart/form-data" >
        {% csrf_token %}
        <div class="mb-3 ">
          <label for="exampleInputEmail1" class="form-label">Recipie name</label>
          <input type="text" class="form-control" name="recipie_name" value = "{{recipe.recipie_name}}">
        </div>
         <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Recipie description</label>
            <textarea class="form-control" name="recipie_description" > {{recipe.recipie_description}}</textarea>
          </div>
         
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Recipie image</label>
            <input type="file" class="form-control" name="recipie_img">
          </div>

          <button type="submit" class="btn btn-primary">Submit</button>
      </form>



</body>
</html>
