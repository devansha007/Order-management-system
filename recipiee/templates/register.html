<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <title>Document</title>
</head>
<body>
    
    <form class="container col-6 mt-5 shadow-lg p-3"  method="POST" >
        {% csrf_token %}
      <h1>Register</h1>
      
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-primary" role="alert">
      {{ message }}
    </div>
      {% endfor %}
        {% endif %}
      
     

        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">First_name</label>
            <input type="text" class="form-control" name="first_name" id="exampleInputPassword1">
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Last_name</label>
            <input type="text" class="form-control" name="last_name" id="exampleInputPassword1">
          </div>
            
        
        
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Username</label>
          <input type="text" class="form-control" name="username" id="exampleInputEmail1" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Password</label>
          <input type="password" name="password" class="form-control" id="exampleInputPassword1">
        </div>
         <p> already have an Account ! <a href="/login/"> login </a></p>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>


</body>
</html>
